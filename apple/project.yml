name: Keyrate
options:
  bundleIdPrefix: com.nulljosh
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
settings:
  base:
    DEVELOPMENT_TEAM: QMM486NPYC
    SWIFT_VERSION: "5.9"
targets:
  Keyrate:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Keyrate
      # one Swift port of score.js, shared with the terminal app
      - path: ../tui/Sources/Score.swift
      - path: Keyrate.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.keyrate
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx" # Xcode 15 needs the list spelled out to offer the simulator
        MARKETING_VERSION: "2.3.0"
        CURRENT_PROJECT_VERSION: 8
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keyrate
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: Keyrate
        ENABLE_HARDENED_RUNTIME: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Keyrate-mac.entitlements
  KeyrateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KeyrateTests
      - Keyrate/Session.swift
      - Keyrate/Words.swift
      - path: ../tui/Sources/Score.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.keyrate.tests
schemes:
  Keyrate:
    build:
      targets:
        Keyrate: all
    test:
      targets: [KeyrateTests]
