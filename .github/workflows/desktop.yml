name: desktop
# On a release tag: the Linux .deb, the Windows .msi and an Android debug APK, attached to that GitHub release.
# Run by hand with a tag to fill in an older release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag, e.g. v2.5.0", required: true }

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, task: ":composeApp:packageDeb :composeApp:assembleDebug" }
          - { os: windows-latest, task: ":composeApp:packageMsi" }
          - { os: macos-15, task: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-java@v4
        if: matrix.task != ''
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.task != ''
      - run: ./gradlew ${{ matrix.task }}
        if: matrix.task != ''
        working-directory: kmp
        shell: bash
      # The SwiftUI Mac app, ad-hoc signed and zipped. Not notarized until Joshua's Developer ID is in CI secrets,
      # so the first launch needs right-click, Open.
      - name: Mac app
        if: runner.os == 'macOS'
        run: |
          brew install xcodegen
          cd apple && xcodegen generate -q
          xcodebuild -scheme Keyrate -configuration Release -destination 'platform=macOS' -derivedDataPath dd CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build -quiet
          ditto -c -k --keepParent dd/Build/Products/Release/Keyrate.app "../Keyrate-${TAG#v}-mac.zip"
      - name: Attach to the release
        shell: bash
        run: |
          # find, not globstar: macOS runners ship bash 3.2
          for apk in $(find kmp/composeApp/build/outputs/apk/debug -name '*.apk' 2>/dev/null || true); do cp "$apk" "Keyrate-${TAG#v}-android-debug.apk"; done
          # a miss is fine (each runner builds only its own files), so neither find nor ls may end the step
          files=$( { find kmp/composeApp/build/compose/binaries \( -name '*.deb' -o -name '*.msi' \) 2>/dev/null || true; find . -maxdepth 1 \( -name 'Keyrate-*-mac.zip' -o -name 'Keyrate-*-android-debug.apk' \) || true; } )
          echo "$files"
          if [ -n "$files" ]; then gh release upload "$TAG" $files --clobber; fi
