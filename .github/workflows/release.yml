name: release
# A pushed vX.Y.Z tag becomes a GitHub release with notes from the commits since the last tag.
# The notarized Mac .dmg is attached by hand until signing secrets exist (roadmap 2.5.0).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --title "Keyrate ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
