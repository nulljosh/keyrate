name: test
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'store/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'store/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scoring, session rules, word list and the shared vectors.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.test.mjs

  # The Kotlin port against the same tests/vectors.json.
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4 # caches the wrapper and dependencies between runs
      - run: ./gradlew :shared:jvmTest
        working-directory: kmp

  # The Swift port (iPhone, iPad, Mac) and the terminal app against the same vectors.
  swift:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate -q && xcodebuild test -quiet -scheme Keyrate -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
        working-directory: apple
      - run: swift build -c release
        working-directory: tui

  # The terminal app builds and passes its checks on Linux too (servers, the Pi).
  tui-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --package-path tui && tui/.build/release/keyrate-tui --check

  # Every file the README points at exists.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import re, os, sys
          refs = re.findall(r'(?:src="|\]\()([^")#?\s]+)', open("README.md").read())
          bad = [r for r in refs if "://" not in r and not r.startswith(("mailto:", "/")) and not os.path.exists(r)]
          print("stale README refs:", bad)
          sys.exit(bool(bad))
          PY
