<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Helvetica Neue', Arial, sans-serif">
<style>
  /* web/palette.css: white and cool greys, blue for the one thing to notice; dark follows the viewer */
  .bg { fill: #fff } .box { fill: #f5f5f7; stroke: #e5e5ea } .key { fill: #007aff } .line { stroke: #d1d1d6; fill: none }
  .t { fill: #1d1d1f } .s { fill: #6e6e73 } .on { fill: #fff }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0b0b0c } .box { fill: #1c1c1e; stroke: #2c2c2e } .key { fill: #0a84ff } .line { stroke: #3a3a3c }
    .t { fill: #f5f5f7 } .s { fill: #a1a1a6 }
  }
  text { font-size: 13px } .h { font-size: 15px; font-weight: 600 } .sm { font-size: 12px }
</style>
<rect class="bg" width="720" height="340" rx="16"/>

<!-- one rule -->
<rect class="key" x="230" y="24" width="260" height="56" rx="12"/>
<text class="on h" x="360" y="48" text-anchor="middle">score.js + vectors.json</text>
<text class="on sm" x="360" y="66" text-anchor="middle">one scoring rule, one shared test file</text>

<path class="line" stroke-width="1.5" d="M360 80 V104 M90 104 H630 M90 104 V128 M270 104 V128 M450 104 V128 M630 104 V128"/>

<!-- four ports -->
<g>
  <rect class="box" x="16" y="128" width="148" height="76" rx="12"/>
  <text class="t h" x="90" y="158" text-anchor="middle">Web</text>
  <text class="s sm" x="90" y="180" text-anchor="middle">web/</text>
</g>
<g>
  <rect class="box" x="196" y="128" width="148" height="76" rx="12"/>
  <text class="t h" x="270" y="158" text-anchor="middle">iPhone, iPad, Mac</text>
  <text class="s sm" x="270" y="180" text-anchor="middle">apple/ SwiftUI</text>
</g>
<g>
  <rect class="box" x="376" y="128" width="148" height="76" rx="12"/>
  <text class="t h" x="450" y="158" text-anchor="middle">Android, desktop</text>
  <text class="s sm" x="450" y="180" text-anchor="middle">kmp/ Compose</text>
</g>
<g>
  <rect class="box" x="556" y="128" width="148" height="76" rx="12"/>
  <text class="t h" x="630" y="158" text-anchor="middle">Terminal</text>
  <text class="s sm" x="630" y="180" text-anchor="middle">tui/ Swift</text>
</g>

<!-- where results live -->
<path class="line" stroke-width="1.5" d="M90 204 V236 M270 204 V236 M450 204 V236 M630 204 V236"/>
<rect class="box" x="16" y="236" width="688" height="40" rx="12"/>
<text class="t" x="360" y="261" text-anchor="middle">Results stay on the device</text>

<text class="s sm" x="16" y="316">Optional account on the web: email and a password hash at api.jaybulb.com. Scores are not uploaded.</text>
</svg>
